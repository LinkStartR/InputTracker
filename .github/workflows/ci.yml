name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore InputTracker.sln
      - name: Build
        run: dotnet build InputTracker.sln -c Release --no-restore
      - name: Test
        run: dotnet test InputTracker.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Publish portable win-x64
        run: dotnet publish InputTracker.sln -c Release -r win-x64 --self-contained true --no-build
